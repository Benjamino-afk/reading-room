<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family:'Hanken Grotesk',sans-serif; }
  #app { height: 100vh; display: flex; flex-direction: column; }
  button { font: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,110,95,0.28); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
  .empty { font-family:'Hanken Grotesk',sans-serif; color:var(--muted,#8b8275); font-size:14px; padding:40px; text-align:center; }
  input.url-input { flex:1; border:none; outline:none; background:transparent; font-family:'IBM Plex Mono',monospace; font-size:13px; color:#2c2722; }
  input.url-input::placeholder { color:#b09e82; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---- helpers ---------------------------------------------------------------
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// serialize a JS style object (camelCase / --custom-props) to an inline string
function ss(obj) {
  return Object.entries(obj).map(([k, v]) => {
    const key = k.startsWith("--") ? k : k.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
    return `${key}:${v}`;
  }).join(";");
}

function fmtTime(ts) {
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 60) return "now";
  if (d < 3600) return Math.floor(d / 60) + "m";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  if (d < 604800) return Math.floor(d / 86400) + "d";
  return new Date(ts * 1000).toLocaleDateString();
}

function metaOf(a) {
  if (a.words > 0) return a.words.toLocaleString() + " words";
  if (a.type === "comic") return (a.panels || 0) + " panels";
  return "photo";
}

const api = {
  feeds: () => fetch("/api/feeds").then(r => r.json()),
  articles: () => fetch("/api/articles?feed=all").then(r => r.json()),
  patch: (id, body) => fetch(`/api/articles/${id}`, {
    method: "PATCH", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)}).then(r => r.json()),
  markAll: feed => fetch(`/api/articles/mark-all-read?feed=${feed}`, {method: "POST"}),
  addFeed: (url, fullText) => fetch("/api/feeds", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url, fullText})}),
  delFeed: id => fetch(`/api/feeds/${id}`, {method: "DELETE"}),
  refresh: () => fetch("/api/refresh", {method: "POST"}),
  importOpml: xml => fetch("/api/opml", {
    method: "POST", headers: {"Content-Type": "text/plain"}, body: xml}),
};

// ---- state -----------------------------------------------------------------
const _qLayout = new URLSearchParams(location.search).get("layout");
const S = {
  layout: (["home","office","board"].includes(_qLayout) ? _qLayout : null)
    || localStorage.getItem("rr-layout") || "home",
  theme: localStorage.getItem("rr-theme") || "light",
  accent: localStorage.getItem("rr-accent") || "terracotta",
  filter: "all",
  boardFilter: false,    // board-view feed picker dropdown open?
  view: "reader",        // reader | manager | story
  storyId: null,
  selected: null,
  feeds: [],
  articles: [],
  fullText: true,
  busy: false,
};

async function load() {
  if (window.__RR_DATA__) {            // preloaded snapshot (offline render)
    S.feeds = window.__RR_DATA__.feeds;
    S.articles = window.__RR_DATA__.articles;
    render();
    return;
  }
  const [feeds, articles] = await Promise.all([api.feeds(), api.articles()]);
  S.feeds = feeds;
  S.articles = articles;
  render();
}

// ---- theme tokens (ported from the design handoff) -------------------------
function tokens() {
  const accentLight = {terracotta:"#b5532e", sage:"#5f7a55", indigo:"#4f5b9a"}[S.accent] || "#b5532e";
  const accentDark  = {terracotta:"#db7d52", sage:"#92ab84", indigo:"#8b97d8"}[S.accent] || "#db7d52";
  const dark = S.theme === "dark";
  const paper = dark ? {
    "--paper":"#1b1814","--card":"#241f1a","--card2":"#2c261f","--ink":"#ece3d4",
    "--muted":"#9c917f","--line":"#352f28","--soft":"#2c2620","--accent":accentDark,
  } : {
    "--paper":"#f7f2e8","--card":"#fffdf8","--card2":"#fbf6ec","--ink":"#2c2722",
    "--muted":"#8b8275","--line":"#e8e1d2","--soft":"#f2ecdf","--accent":accentLight,
  };
  const office = dark ? {
    "--o-bg":"#1b1a19","--o-pane":"#252423","--o-line":"#3b3a39","--o-ink":"#f3f2f1",
    "--o-sub":"#c8c6c4","--o-sel":"#2b3a4f","--o-selbar":"#479ef5","--o-blue":"#479ef5","--o-hover":"#323130",
  } : {
    "--o-bg":"#faf9f8","--o-pane":"#ffffff","--o-line":"#edebe9","--o-ink":"#201f1e",
    "--o-sub":"#605e5c","--o-sel":"#eaf1fb","--o-selbar":"#0f6cbd","--o-blue":"#0f6cbd","--o-hover":"#f3f2f1",
  };
  const board = dark ? {
    "--b-bg":"#1d2125","--b-col":"#22272b","--b-card":"#282e33","--b-cardline":"#323940",
    "--b-ink":"#c7d1db","--b-sub":"#9fadbc","--b-line":"#2c333a","--b-accent":"#579dff",
    "--b-chip":"#38414a","--b-chipink":"#c7d1db","--b-done":"#4bce97","--b-shadow":"rgba(0,0,0,0.4)",
  } : {
    "--b-bg":"#ffffff","--b-col":"#f7f8f9","--b-card":"#ffffff","--b-cardline":"transparent",
    "--b-ink":"#172b4d","--b-sub":"#626f86","--b-line":"#dfe1e6","--b-accent":"#0c66e4",
    "--b-chip":"#dce0e6","--b-chipink":"#44546f","--b-done":"#22a06b","--b-shadow":"rgba(9,30,66,0.2)",
  };
  return {paper, office, board, dark};
}

// Reading-view (full story) palette that follows the active layout + theme,
// so opening an item doesn't snap back to the paper/terracotta look.
function readingPalette() {
  const {paper, office, board, dark} = tokens();
  if (S.layout === "office") return {
    bg: office["--o-pane"], ink: office["--o-ink"], body: office["--o-ink"], sub: office["--o-sub"],
    line: office["--o-line"], accent: office["--o-blue"], accentInk: "#ffffff",
    chipBg: dark ? "#143a2a" : "#eff6ec", chipInk: dark ? "#6cc18d" : "#107c41", chipLine: dark ? "#1f5236" : "#cfe3c4",
  };
  if (S.layout === "board") return {
    bg: board["--b-card"], ink: board["--b-ink"], body: board["--b-ink"], sub: board["--b-sub"],
    line: board["--b-line"], accent: board["--b-accent"], accentInk: "#ffffff",
    chipBg: board["--b-chip"], chipInk: board["--b-chipink"], chipLine: board["--b-line"],
  };
  return {  // home / paper
    bg: paper["--card"], ink: paper["--ink"], body: dark ? "#d9cfbd" : "#39342c", sub: paper["--muted"],
    line: paper["--line"], accent: paper["--accent"], accentInk: "#ffffff",
    chipBg: dark ? "#23291f" : "#eef2e9", chipInk: dark ? "#9bb088" : "#5f7a55", chipLine: dark ? "#33402a" : "#d8e0cd",
  };
}

function feedRows() {
  const total = S.feeds.reduce((n, f) => n + f.unread, 0);
  return [{id: "all", name: "All Stories", color: "#a89e8d", unread: total}, ...S.feeds];
}

function visibleArticles() {
  return S.articles.filter(a => S.filter === "all" || String(a.feedId) === String(S.filter));
}

function filterName() {
  const f = feedRows().find(f => String(f.id) === String(S.filter));
  return f ? f.name : "All Stories";
}

// ---- header ----------------------------------------------------------------
function headerHTML() {
  const {office, board, dark} = tokens();
  // Header palette follows the active layout so the logo + chrome match the view.
  const h = S.layout === "office"
    ? { bg: office["--o-pane"], ink: office["--o-ink"], line: office["--o-line"], accent: office["--o-blue"], soft: dark ? "#3b3a39" : "#e7ebf1", muted: office["--o-sub"] }
    : S.layout === "board"
    ? { bg: board["--b-bg"], ink: board["--b-ink"], line: board["--b-line"], accent: board["--b-accent"], soft: dark ? "#2c333a" : "#ebecf0", muted: board["--b-sub"] }
    : { bg: "var(--card)", ink: "var(--ink)", line: "var(--line)", accent: "var(--accent)", soft: "var(--soft)", muted: "var(--muted)" };
  const segBase = "padding:7px 15px;border:none;border-radius:8px;font-family:'Hanken Grotesk',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;min-width:66px";
  const seg = id => S.layout === id
    ? `${segBase};background:${h.bg};color:${h.ink};box-shadow:0 1px 2px rgba(0,0,0,0.16)`
    : `${segBase};background:transparent;color:${h.muted}`;
  return `
  <div style="flex:0 0 auto;height:62px;display:flex;align-items:center;gap:16px;padding:0 18px;background:${h.bg};border-bottom:1px solid ${h.line};transition:background 0.2s,border-color 0.2s;">
    <div style="display:flex;align-items:center;gap:11px;">
      <div style="width:27px;height:27px;border-radius:7px;background:${h.accent};box-shadow:inset 0 0 0 2px rgba(255,255,255,0.18);"></div>
      <span style="font-family:'Newsreader',serif;font-size:22px;font-weight:600;color:${h.ink};letter-spacing:-0.01em;">Reading&nbsp;Room</span>
    </div>
    <div style="margin:0 auto;display:flex;gap:4px;padding:4px;background:${h.soft};border-radius:11px;">
      <button data-act="layout" data-layout="home" style="${seg("home")}">Home</button>
      <button data-act="layout" data-layout="office" style="${seg("office")}">Office</button>
      <button data-act="layout" data-layout="board" style="${seg("board")}">Board</button>
    </div>
    <button data-act="refresh" title="Poll feeds now" style="padding:7px 12px;border:1px solid ${h.line};background:${h.bg};border-radius:9px;color:${h.muted};font-size:13px;cursor:pointer;">${S.busy ? "Syncing…" : "↻ Sync"}</button>
    <button data-act="theme" style="display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid ${h.line};background:${h.bg};border-radius:9px;color:${h.muted};font-size:13px;cursor:pointer;"><span style="font-size:14px;">${dark ? "☾" : "☀"}</span>${dark ? "Dark" : "Light"}</button>
    <button data-act="manager" style="padding:8px 15px;border:none;border-radius:9px;background:${h.accent};color:#fff;font-size:13px;font-weight:600;cursor:pointer;">+ Add feed</button>
  </div>`;
}

// ---- HOME ------------------------------------------------------------------
function homeHTML() {
  const rows = feedRows();
  const feedRowsHTML = rows.map(f => {
    const active = String(S.filter) === String(f.id);
    const rowStyle = "display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:none;border-radius:9px;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;font-size:13.5px;text-align:left;margin-bottom:2px;"
      + (active ? "background:var(--soft);color:var(--ink);font-weight:600;" : "background:transparent;color:var(--muted);font-weight:500;");
    return `<button data-act="filter" data-feed="${esc(f.id)}" style="${rowStyle}">
      <span style="width:9px;height:9px;border-radius:50%;background:${esc(f.color)};flex:0 0 auto;"></span>
      <span style="flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(f.name)}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:0.8;">${f.unread}</span>
    </button>`;
  }).join("");

  const arts = visibleArticles();
  const cards = arts.map(a => {
    const dim = a.read ? 0.58 : 1;
    let media = "";
    if (a.type === "comic") {
      const imgs = (a.images || []).slice(0, 4);
      if (imgs.length) {
        media = `<div style="display:flex;gap:2px;padding:2px;background:var(--line);">${
          imgs.map(s => `<div style="flex:1;height:120px;background:#000 center/cover no-repeat url('${esc(s)}');"></div>`).join("")}</div>`;
      } else {
        const panel = `<div style="flex:1;height:120px;background:repeating-linear-gradient(135deg,var(--card2),var(--card2) 8px,var(--soft) 8px,var(--soft) 16px);"></div>`;
        media = `<div style="display:flex;gap:2px;padding:2px;background:var(--line);">${panel.repeat(4)}</div>`;
      }
    } else if (a.type === "photo") {
      const img = (a.images || [])[0];
      media = img
        ? `<div style="height:178px;background:#000 center/cover no-repeat url('${esc(img)}');"></div>`
        : `<div style="height:178px;background:repeating-linear-gradient(135deg,var(--card2),var(--card2) 11px,var(--soft) 11px,var(--soft) 22px);display:flex;align-items:center;justify-content:center;"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;color:var(--muted);">[ image — drop photo ]</span></div>`;
    }
    return `<article style="background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;opacity:${dim};">
      ${media}
      <div style="padding:13px 15px 14px;display:flex;flex-direction:column;flex:1;">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px;">
          <span style="width:8px;height:8px;border-radius:50%;background:${esc(a.feedColor)};flex:0 0 auto;"></span>
          <span style="font-size:11.5px;font-weight:600;color:var(--muted);">${esc(a.feed)}</span>
          <span style="margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);">${fmtTime(a.time)}</span>
        </div>
        <h3 data-act="story" data-id="${a.id}" style="font-family:'Newsreader',serif;font-size:17px;line-height:1.24;margin:0 0 7px;color:var(--ink);font-weight:${a.read ? 480 : 600};cursor:pointer;">${esc(a.title)}</h3>
        <p style="font-family:'Spectral',serif;font-size:13.5px;line-height:1.55;color:var(--muted);margin:0 0 14px;flex:1;">${esc(a.snippet)}</p>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.05em;color:var(--muted);text-transform:uppercase;">${esc(metaOf(a))}</span>
          <button data-act="toggleRead" data-id="${a.id}" style="margin-left:auto;border:none;background:transparent;font-size:12px;color:var(--accent);cursor:pointer;font-weight:600;">${a.read ? "✓ Read" : "Mark read"}</button>
        </div>
      </div>
    </article>`;
  }).join("");

  const grid = arts.length
    ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:18px;">${cards}</div>`
    : `<div class="empty">No stories yet. Click <strong>+ Add feed</strong> to get started.</div>`;

  return `
  <aside style="flex:0 0 236px;border-right:1px solid var(--line);padding:16px 12px;background:var(--card);overflow-y:auto;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 8px 11px;">
      <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;">Feeds</span>
      <span data-act="manager" style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--muted);cursor:pointer;line-height:1;">+</span>
    </div>
    ${feedRowsHTML}
    <div style="margin-top:auto;padding:14px 9px 2px;border-top:1px solid var(--line);">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;line-height:1.6;color:var(--muted);">self-hosted · reading-room<br>${S.articles.length} stories stored</div>
    </div>
  </aside>
  <main style="flex:1 1 auto;overflow:hidden;display:flex;flex-direction:column;min-width:0;">
    <div style="overflow-y:auto;padding:22px 26px 30px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;">
        <div>
          <div style="font-family:'Newsreader',serif;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;">${esc(filterName())}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:3px;">${arts.length} stories · full text fetched on your server, no link-outs</div>
        </div>
        <button data-act="markAll" style="padding:7px 13px;border:1px solid var(--line);background:transparent;border-radius:9px;color:var(--muted);font-size:12.5px;cursor:pointer;white-space:nowrap;">Mark all read</button>
      </div>
      ${grid}
    </div>
  </main>`;
}

// ---- OFFICE ----------------------------------------------------------------
function officeHTML() {
  const {office} = tokens();
  const rows = feedRows();
  const arts = visibleArticles();
  let selId = (S.selected != null && arts.some(a => a.id === S.selected)) ? S.selected : (arts[0] && arts[0].id);

  const folders = rows.map(f => {
    const active = String(S.filter) === String(f.id);
    const style = `display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:none;border-left:3px solid ${active ? "var(--o-selbar)" : "transparent"};background:${active ? "var(--o-sel)" : "transparent"};color:var(--o-ink);cursor:pointer;font-size:13px;font-weight:${active ? 600 : 500};text-align:left;`;
    return `<button data-act="filter" data-feed="${esc(f.id)}" style="${style}">
      <span style="color:var(--o-sub);font-size:13px;">📁</span>
      <span style="flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(f.name)}</span>
      <span style="font-size:11.5px;color:var(--o-sub);">${f.unread}</span>
    </button>`;
  }).join("");

  const list = arts.map(a => {
    const selected = a.id === selId;
    const rowStyle = `display:flex;align-items:flex-start;gap:10px;padding:9px 14px 9px 11px;cursor:pointer;border-bottom:1px solid var(--o-line);border-left:3px solid ${selected ? "var(--o-selbar)" : "transparent"};background:${selected ? "var(--o-sel)" : "transparent"};`;
    return `<div data-act="selectMail" data-id="${a.id}" style="${rowStyle}">
      <span style="width:8px;height:8px;border-radius:50%;background:${a.read ? "transparent" : "var(--o-blue)"};flex:0 0 auto;margin-top:4px;"></span>
      <div style="flex:1 1 auto;min-width:0;">
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span style="font-size:13px;color:var(--o-ink);font-weight:${a.read ? 400 : 700};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;">${esc(a.feed)}</span>
          <span style="font-size:11.5px;color:var(--o-sub);flex:0 0 auto;">${fmtTime(a.time)}</span>
        </div>
        <div style="font-size:12.5px;color:${a.read ? "var(--o-sub)" : "var(--o-ink)"};font-weight:${a.read ? 400 : 600};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;">${esc(a.title)}</div>
        <div style="font-size:12px;color:var(--o-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">${esc(a.snippet)}</div>
      </div>
    </div>`;
  }).join("");

  const sel = arts.find(a => a.id === selId);
  let pane = `<div class="empty">Select a message to read it here.</div>`;
  if (sel) {
    let media = "";
    const imgs = sel.images || [];
    if (imgs.length) {
      media = imgs.map(s => `<img src="${esc(s)}" style="max-width:100%;border-radius:4px;margin-bottom:20px;display:block;">`).join("");
    } else if (sel.type === "comic" || sel.type === "photo") {
      media = `<div style="height:232px;border-radius:4px;margin-bottom:20px;background:repeating-linear-gradient(135deg,#eef0f3,#eef0f3 12px,#e2e5ea 12px,#e2e5ea 24px);display:flex;align-items:center;justify-content:center;"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a8f98;">[ image — fetched inline ]</span></div>`;
    }
    const body = (sel.body || []).map(p =>
      `<p style="font-size:14.5px;line-height:1.66;color:var(--o-ink);margin:0 0 16px;overflow-wrap:anywhere;">${esc(p)}</p>`).join("");
    pane = `<div style="flex:1 1 auto;overflow-y:auto;">
      <div style="background:var(--o-pane);border-bottom:1px solid var(--o-line);padding:18px 28px 0;">
        <h1 style="font-size:20px;line-height:1.3;font-weight:600;color:var(--o-ink);margin:0 0 14px;">${esc(sel.title)}</h1>
        <div style="display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;">
          <span style="width:34px;height:34px;border-radius:50%;background:${esc(sel.feedColor)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto;">${esc(sel.feed.charAt(0))}</span>
          <div style="min-width:0;flex:1 1 auto;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:13.5px;font-weight:600;color:var(--o-ink);">${esc(sel.feed)}</span>
              <span style="margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--o-blue);font-size:12.5px;">
                <span data-act="story" data-id="${sel.id}" style="cursor:pointer;">⤢ Open full story</span>
              </span>
            </div>
            <div style="font-size:12px;color:var(--o-sub);margin-top:2px;">To: You · ${fmtTime(sel.time)} ago</div>
          </div>
        </div>
      </div>
      <div style="padding:22px 28px 40px;">
        <div style="max-width:640px;">

// ---- BOARD -----------------------------------------------------------------
function boardHTML() {
  const {board: b} = tokens();
  const arts = visibleArticles();
  const priColors = {high:"#e2483d", med:"#e09f3e", low:"#4a90d6"};
  const card = a => {
    const pri = a.words > 1000 ? "high" : (a.type === "comic" ? "low" : "med");
    const done = a.status === "done";
    const check = done
      ? `<span data-act="cycle" data-id="${a.id}" title="Move to next column" style="width:15px;height:15px;border:1.5px solid ${b["--b-done"]};border-radius:3px;background:${b["--b-done"]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto;cursor:pointer;">✓</span>`
      : `<span data-act="cycle" data-id="${a.id}" title="Move to next column" style="width:15px;height:15px;border:1.5px solid ${b["--b-sub"]};border-radius:3px;flex:0 0 auto;cursor:pointer;"></span>`;
    return `<div data-act="story" data-id="${a.id}" style="background:${b["--b-card"]};border:1px solid ${b["--b-cardline"]};border-radius:4px;box-shadow:0 1px 1px ${b["--b-shadow"]};padding:11px 12px;margin-bottom:8px;cursor:pointer;${done ? "opacity:0.78;" : ""}">
      <div style="font-size:13px;line-height:1.36;color:${b["--b-ink"]};margin-bottom:12px;">${esc(a.title)}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${check}
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${b["--b-sub"]};">RSS-${a.id}</span>
        <span style="color:${priColors[pri]};font-weight:700;font-size:15px;line-height:1;flex:0 0 auto;margin-left:auto;">≡</span>

      <div style="flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 14px 10px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:${b["--b-sub"]};font-weight:600;">${label} ${extra}${pill(items.length)}</div>
      <div style="flex:1 1 auto;overflow-y:auto;padding:0 8px 8px;">${items.map(card).join("")}${footer}</div>
    </div>`;

  return `<div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;height:100%;background:${b["--b-bg"]};">
    <div style="flex:0 0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;border-bottom:1px solid ${b["--b-line"]};background:${b["--b-bg"]};">

      <div style="position:relative;">

        ${S.boardFilter ? `<div data-act="modalKeep" style="position:absolute;top:36px;left:0;z-index:40;width:230px;max-height:340px;overflow-y:auto;background:${b["--b-card"]};border:1px solid ${b["--b-line"]};border-radius:6px;box-shadow:0 8px 24px ${b["--b-shadow"]};padding:5px;">${

// ---- FULL STORY ------------------------------------------------------------
function storyHTML() {
  const a = S.articles.find(x => x.id === S.storyId);
  if (!a) { S.view = "reader"; return readerBodyHTML(); }
  const p = readingPalette();
  const idx = S.articles.findIndex(x => x.id === a.id);
  const mins = Math.max(1, Math.round((a.words || 200) / 230));
  const metaLine = `FULL STORY FETCHED ON YOUR SERVER · NO LINK-OUT · ${esc(metaOf(a).toUpperCase())} · ~${mins} MIN`;
  const paras = a.body || [];
  const imgs = a.images || [];
  let bodyHTML = "";
  paras.forEach((para, i) => {
    bodyHTML += `<p style="font-family:'Newsreader',serif;font-size:19px;line-height:1.72;color:${p.body};margin:0 0 22px;">${esc(para)}</p>`;
    if (i === 1 && imgs[0]) {
      bodyHTML += `<img src="${esc(imgs[0])}" style="width:100%;border-radius:10px;margin:8px 0 22px;display:block;">`;
    }
  });
  imgs.slice(paras.length > 1 ? 1 : 0).forEach(s => {
    bodyHTML += `<img src="${esc(s)}" style="width:100%;border-radius:10px;margin:8px 0 22px;display:block;">`;
  });

  return `<div style="height:100%;overflow-y:auto;background:${p.bg};">
    <div style="height:52px;display:flex;align-items:center;gap:14px;padding:0 22px;background:${p.bg};border-bottom:1px solid ${p.line};position:sticky;top:0;">
      <span data-act="back" style="font-size:13px;color:${p.sub};cursor:pointer;">‹ All Stories</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:${p.sub};">
        <span data-act="storyPrev" style="cursor:pointer;${idx <= 0 ? "opacity:0.4;pointer-events:none;" : ""}">‹ Prev</span>
        <span data-act="storyNext" style="cursor:pointer;${idx >= S.articles.length - 1 ? "opacity:0.4;pointer-events:none;" : ""}">Next ›</span>
        <span data-act="toggleRead" data-id="${a.id}" style="padding:5px 11px;border-radius:8px;background:${p.accent};color:${p.accentInk};font-weight:600;cursor:pointer;">${a.read ? "✓ Read" : "✓ Mark read"}</span>
      </div>
    </div>
    <div style="max-width:660px;margin:0 auto;padding:40px 28px 52px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;"><span style="width:8px;height:8px;border-radius:50%;background:${esc(a.feedColor)};"></span><span style="font-size:12.5px;font-weight:600;color:${p.sub};">${esc(a.feed)}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${p.sub};">· ${fmtTime(a.time)} ago</span></div>
      <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:${p.chipBg};border:1px solid ${p.chipLine};margin-bottom:22px;">
        <span style="color:${p.chipInk};font-size:13px;">✓</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${p.chipInk};letter-spacing:0.02em;">${metaLine}</span>
      </div>
      <h1 style="font-family:'Newsreader',serif;font-size:38px;line-height:1.14;font-weight:600;color:${p.ink};letter-spacing:-0.015em;margin:0 0 14px;">${esc(a.title)}</h1>
      <div style="font-size:13.5px;color:${p.sub};margin-bottom:30px;">${esc(a.feed)}</div>
      ${bodyHTML || `<p style="font-family:'Newsreader',serif;font-size:19px;color:${p.body};">No body text was extracted for this item.</p>`}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid ${p.line};">
        <button data-act="storyPrev" ${idx <= 0 ? "disabled" : ""} style="padding:9px 16px;border:1px solid ${p.line};background:transparent;border-radius:9px;font-size:13px;color:${p.sub};cursor:pointer;opacity:${idx <= 0 ? 0.4 : 1};">‹ Previous</button>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${p.sub};">${idx + 1} of ${S.articles.length}</span>
        <button data-act="storyNext" ${idx >= S.articles.length - 1 ? "disabled" : ""} style="padding:9px 16px;border:none;background:${p.accent};color:${p.accentInk};border-radius:9px;font-size:13px;cursor:pointer;opacity:${idx >= S.articles.length - 1 ? 0.4 : 1};">Next story ›</button>
      </div>
    </div>
  </div>`;
}

// ---- popout modal ----------------------------------------------------------
// Backdrop closes on click; the inner window carries data-act="modalKeep" so a
// click on story content resolves there (a no-op) instead of bubbling to close.
function modalHTML() {
  return `
  <div data-act="back" style="position:fixed;inset:0;z-index:60;background:rgba(15,20,30,0.55);display:flex;align-items:center;justify-content:center;padding:28px;">
    <div data-act="modalKeep" style="position:relative;width:min(720px,92%);height:min(80vh,860px);border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,0.45);display:flex;flex-direction:column;">
      ${storyHTML()}
    </div>
  </div>`;
}

// ---- render ----------------------------------------------------------------
function readerBodyHTML() {
  if (S.layout === "office") return officeHTML();
  if (S.layout === "board") return boardHTML();
  return homeHTML();
}

function render() {
  const {paper} = tokens();
  const app = $("#app");
  app.setAttribute("style", ss(paper));
  if (S.view === "manager") {
    app.innerHTML = headerHTML() + managerHTML();
    return;
  }
  // The story opens as a popout modal floating over the current layout, so the
  // board/grid/list stays visible behind it (rather than replacing the screen).
  const reader = headerHTML()
    + `<div style="flex:1 1 auto;display:flex;min-height:0;background:var(--paper);">${readerBodyHTML()}</div>`;
  const storyOpen = S.view === "story" && S.articles.some(x => x.id === S.storyId);
  app.innerHTML = storyOpen ? reader + modalHTML() : reader;
  if (S.view === "story" && !storyOpen) S.view = "reader";
}

// ---- events ----------------------------------------------------------------
async function withBusy(fn) {
  S.busy = true; render();
  try { await fn(); } finally { S.busy = false; }
  await load();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.view === "story") { S.view = "reader"; render(); }
});

document.addEventListener("submit", async e => {
  const form = e.target.closest('[data-act="addFeed"]');
  if (!form) return;
  e.preventDefault();
  const url = form.url.value.trim();
  if (!url) return;
  await withBusy(async () => {
    const r = await api.addFeed(url, S.fullText);
    if (!r.ok) { const j = await r.json().catch(() => ({})); alert("Could not add feed: " + (j.detail || r.status)); }
  });
});

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  // Close the Board feed picker on any click that isn't toggling/using it.
  if (S.boardFilter && (!t || !["boardFilter", "filter", "modalKeep"].includes(t.dataset.act))) {
    S.boardFilter = false;
    if (!t) { render(); return; }
  }
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id ? Number(t.dataset.id) : null;

  switch (act) {
    case "layout":
      S.layout = t.dataset.layout; localStorage.setItem("rr-layout", S.layout); render(); break;
    case "theme":
      S.theme = S.theme === "dark" ? "light" : "dark"; localStorage.setItem("rr-theme", S.theme); render(); break;
    case "filter":
      S.filter = t.dataset.feed; S.selected = null; S.boardFilter = false; render(); break;
    case "boardFilter":
      S.boardFilter = !S.boardFilter; render(); break;
    case "manager":
      S.view = "manager"; render(); break;
    case "back":
      S.view = "reader"; render(); break;
    case "modalKeep":
      break;  // click landed inside the popout window — keep it open
    case "toggleFull":
      S.fullText = !S.fullText; render(); break;
    case "selectMail":
      S.selected = id; render(); break;
    case "story":
      S.storyId = id; S.view = "story"; render(); break;
    case "storyPrev": {
      const i = S.articles.findIndex(x => x.id === S.storyId);
      if (i > 0) { S.storyId = S.articles[i - 1].id; render(); } break;
    }
    case "storyNext": {
      const i = S.articles.findIndex(x => x.id === S.storyId);
      if (i >= 0 && i < S.articles.length - 1) { S.storyId = S.articles[i + 1].id; render(); } break;
    }
    case "toggleRead": {
      const a = S.articles.find(x => x.id === id);
      if (a) { a.read = !a.read; await api.patch(id, {read: a.read}); await load(); }
      break;
    }
    case "cycle": {
      const a = S.articles.find(x => x.id === id);
      if (a) { const next = {todo:"doing", doing:"done", done:"todo"}[a.status];
        a.status = next; await api.patch(id, {status: next}); await load(); }
      break;
    }
    case "markAll":
      await api.markAll(S.filter); await load(); break;
    case "delFeed":
      if (confirm("Remove this feed and its articles?")) { await api.delFeed(id); await load(); }
      break;
    case "refresh":
      await withBusy(() => api.refresh()); break;
    case "importOpml": {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".opml,.xml,text/xml";
      inp.onchange = async () => {
        const file = inp.files[0]; if (!file) return;
        await withBusy(async () => { await api.importOpml(await file.text()); });
      };
      inp.click();
      break;
    }
  }
});

// ---- boot ------------------------------------------------------------------
load();
</script>
</body>
</html>
