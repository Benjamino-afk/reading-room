# Reading Room + its Cognito login gate.
#
# ONE Portainer stack (project "reading-room") holding both services. This
# replaces an older layout, where oauth2-proxy was a separate stack on the
# default bridge reaching the app via 172.17.0.1:8087. Here they share a
# compose network, so the upstream is the service name.
#
# Two doors, by design:
#   :8087  LAN/tailnet only, UNAUTHENTICATED (trusted network)
#   :4180  the only port Tailscale Funnel publishes — Cognito-gated
#
# Portainer stack env vars (host details + secrets stay out of git):
#   FUNNEL_HOST, COGNITO_POOL_ID, COGNITO_CLIENT_ID, CLIENT_SECRET, COOKIE_SECRET
#
# Portainer gotcha: create the stack from this file via Add stack -> Upload.
# Pasting into the web editor can corrupt the YAML.
services:
  reading-room:
    image: "ghcr.io/benjamino-afk/reading-room:latest"
    container_name: "reading-room"
    restart: "unless-stopped"
    ports:
      - "8087:8080"
    volumes:
      - "/volume1/tank/config/reading-room/data:/data"
    environment:
      DATA_DIR: "/data"
      POLL_INTERVAL: "30"
      READONLY: "0"
      MAX_IMAGES: "12"
      FETCH_TIMEOUT: "20"

  reading-room-auth:
    image: "quay.io/oauth2-proxy/oauth2-proxy:v7.6.0"
    container_name: "reading-room-auth"
    restart: "unless-stopped"
    depends_on:
      - "reading-room"
    ports:
      - "4180:4180"
    volumes:
      # One address per line. This file MUST exist, as a FILE, before the stack
      # is updated — Docker would otherwise create a directory at this path and
      # oauth2-proxy exits on boot. See README ("Pin the allowed email").
      - "/volume1/tank/config/reading-room-auth/authenticated-emails.txt:/etc/oauth2-proxy/authenticated-emails.txt:ro"
    environment:
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://cognito-idp.ap-southeast-2.amazonaws.com/${COGNITO_POOL_ID}"
      OAUTH2_PROXY_CLIENT_ID: "${COGNITO_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${COOKIE_SECRET}"
      OAUTH2_PROXY_UPSTREAMS: "http://reading-room:8080"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # No EMAIL_DOMAINS: a "*" there short-circuits the allow-list and lets any
      # verified Cognito user in. The mounted file is the only way in.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/oauth2-proxy/authenticated-emails.txt"
      OAUTH2_PROXY_REDIRECT_URL: "https://${FUNNEL_HOST}/oauth2/callback"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${FUNNEL_HOST}"
      OAUTH2_PROXY_COOKIE_DOMAINS: "${FUNNEL_HOST}"
