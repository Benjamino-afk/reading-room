# oauth2-proxy — Cognito login gate in front of Reading Room, on the NAS.
#
# Deploy as its OWN Portainer stack (do NOT merge into the reading-room stack).
# It sits on the default bridge so it has internet egress to reach Cognito, and
# reaches Reading Room via the host's already-published :8087 (default bridge
# has no service-name DNS — see project-new-nas networking note).
#
# Tailscale Funnel publishes ONLY this container's :4180 to the internet.
# Reading Room's own :8087 stays LAN/tailnet-only and unauthenticated (trusted).
#
# Secrets (CLIENT_SECRET, COOKIE_SECRET) are set as Portainer stack env vars,
# NOT written here. Non-secret values are inlined for clarity.
services:
  reading-room-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: reading-room-auth
    restart: unless-stopped
    network_mode: bridge          # default bridge = internet egress for Cognito
    ports:
      - "4180:4180"               # tailscale serve/funnel points here
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      # from cognito-setup.sh output:
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://cognito-idp.ap-southeast-2.amazonaws.com/REPLACE_POOL_ID
      OAUTH2_PROXY_CLIENT_ID: REPLACE_CLIENT_ID
      OAUTH2_PROXY_CLIENT_SECRET: ${CLIENT_SECRET}          # Portainer env
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}          # Portainer env (32-byte base64)
      # upstream = Reading Room via the host's published port (docker0 gateway):
      OAUTH2_PROXY_UPSTREAMS: http://172.17.0.1:8087
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"                    # behind Funnel/Tailscale
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"             # straight to Cognito login
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"                       # any verified Cognito user
      # public funnel hostname, e.g. as5404t-6005-1.tailXXXX.ts.net:
      OAUTH2_PROXY_REDIRECT_URL: https://REPLACE_FUNNEL_HOST/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: REPLACE_FUNNEL_HOST
      OAUTH2_PROXY_COOKIE_DOMAINS: REPLACE_FUNNEL_HOST
